<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Charles Berthou - IA appliquee, outils et cas d'usage</title>
  <desc id="desc">Carte de partage social pour charlesberthou.fr avec fond bleu nuit, accent cyan et portrait IA abstrait.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07142f"/>
      <stop offset="0.48" stop-color="#0d1b3e"/>
      <stop offset="1" stop-color="#172b66"/>
    </linearGradient>
    <linearGradient id="accent" x1="92" y1="110" x2="715" y2="516" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="mark" x1="76" y1="64" x2="188" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 246) rotate(30) scale(500 260)">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="0.52" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0d1b3e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <clipPath id="heroClip">
      <rect x="606" y="0" width="594" height="630" rx="0"/>
    </clipPath>
    <clipPath id="logoClip">
      <rect x="84" y="72" width="76" height="76" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g clip-path="url(#heroClip)">
    <image href="../images/hero-ia-profile-reflection-1254.webp" x="548" y="-232" width="790" height="790" preserveAspectRatio="xMidYMid slice" opacity="0.58"/>
    <rect x="570" y="0" width="630" height="630" fill="url(#bg)" opacity="0.24"/>
    <rect x="540" y="0" width="360" height="630" fill="url(#bg)" opacity="0.74"/>
  </g>

  <path d="M83 494 C221 414 327 541 453 456 C586 366 638 440 746 356 C862 266 965 304 1086 212" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.42"/>
  <path d="M92 536 C242 466 328 581 482 501 C604 438 661 474 790 403 C918 332 1018 367 1118 300" fill="none" stroke="#67e8f9" stroke-width="1.4" stroke-linecap="round" opacity="0.22"/>
  <g opacity="0.42">
    <circle cx="164" cy="505" r="4" fill="#67e8f9"/>
    <circle cx="346" cy="489" r="5" fill="#ffffff"/>
    <circle cx="534" cy="417" r="4" fill="#06b6d4"/>
    <circle cx="748" cy="356" r="6" fill="#67e8f9"/>
    <circle cx="972" cy="286" r="4" fill="#ffffff"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="72" y="64" width="96" height="96" rx="24" fill="#ffffff" opacity="0.08"/>
    <g clip-path="url(#logoClip)">
      <rect x="84" y="72" width="76" height="76" rx="20" fill="#111827"/>
      <rect x="84" y="72" width="76" height="76" rx="20" fill="url(#accent)" opacity="0.98"/>
      <path d="M105 124 V96 h18 c9 0 15 5 15 14 s-6 14 -15 14 h-18 Z M116 115 h7 c4 0 7 -2 7 -5 s-3 -5 -7 -5 h-7 v10 Z" fill="#ffffff"/>
      <path d="M143 91 v39" stroke="url(#mark)" stroke-width="7" stroke-linecap="round"/>
      <path d="M135 102 h17 M135 120 h17" stroke="#ecfeff" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <text x="190" y="110" fill="#cbd5e1" font-family="Outfit, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="0">charlesberthou.fr</text>
  <text x="72" y="258" fill="#ffffff" font-family="Outfit, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="0">Charles Berthou</text>
  <rect x="74" y="291" width="132" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="360" fill="#dbeafe" font-family="Outfit, Segoe UI, Arial, sans-serif" font-size="39" font-weight="700" letter-spacing="0">IA appliquée, outils et cas d'usage</text>
  <text x="72" y="421" fill="#9fb0ca" font-family="Outfit, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" letter-spacing="0">Comprendre, cadrer et déployer l'intelligence artificielle.</text>

  <g transform="translate(72 526)">
