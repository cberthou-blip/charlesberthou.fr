<main id="contenu" class="article-page shell" tabindex="-1">
 <a class="text-link article-back" href="/articles/"><span aria-hidden="true">←</span> Tous les articles</a>
 <article aria-labelledby="article-title">
  <header class="article-heading">
   <p class="eyebrow">$theme</p>
   <h1 id="article-title">$article_title</h1>
   <p class="article-byline"><span>$author_name</span><time datetime="$date">$date_label</time><span>$minutes min de lecture</span></p>
   <p class="article-lead">$summary</p>
  </header>
  <div class="article-cover">$image</div>
  <div class="article-body">$body</div>
  $references
  <footer class="article-source">$source_link</footer>
 </article>
 <nav class="article-after" aria-label="Poursuivre la lecture">
  <a class="article-next" href="$next_url"><span class="eyebrow">À lire aussi</span><span class="article-next-title">$next_title <span class="arrow" aria-hidden="true">→</span></span></a>
  <a class="text-link" href="/articles/">Tous les articles <span class="arrow" aria-hidden="true">→</span></a>
 </nav>
</main>
