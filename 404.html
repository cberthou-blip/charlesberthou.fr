<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="/assets/styles/site.css" />
  <script>
    (function () {
      var path = window.location.pathname.toLowerCase();
      var dest = null;
      if (path.indexOf("/articles") === 0) dest = path.replace("/articles", "/blog");
      else if (path.indexOf("/gpts") !== -1) dest = "/#outils";
      else if (path.indexOf("/e-learning") !== -1 || path.indexOf("/elearning") !== -1) dest = "/#outils";
      else if (path.indexOf("/contact") !== -1) dest = "/#contact";
      if (dest) window.location.replace(dest);
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar">
      <a class="brand" href="/">charlesberthou.fr</a>
      <nav class="main-nav" aria-label="Navigation principale">
        <a href="/#blog">Blog</a>
        <a href="/#outils">Outils IA</a>
        <a href="/#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <p class="eyebrow">404</p>
      <h1 style="font-size:clamp(2.2rem,8vw,4.2rem);line-height:1;margin:10px 0 14px;">Page introuvable</h1>

  <footer class="site-footer">

    </div>
  </footer>
